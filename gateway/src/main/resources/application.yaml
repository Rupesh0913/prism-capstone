spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379

prism:
  providers:
    alpha:
      base-url: http://localhost:9001
      timeout: 5s
    beta:
      base-url: http://localhost:9002
      timeout: 5s
  chroma:
    url: http://localhost:8000
    similarity-threshold: 0.20